<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="Termostato simulado corriendo en una computadora de escritorio, con su propia interfaz web y su entidad en Home Assistant">
  <title>Termostato simulado en una computadora de escritorio</title>
  <desc>Monitor de escritorio con dos paneles: a la izquierda la interfaz web del propio dispositivo simulado en localhost:8080, a la derecha la misma entidad expuesta como tarjeta de termostato en Home Assistant en localhost:8123.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#dde5ef"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4551"/>
      <stop offset="1" stop-color="#222932"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3742"/>
      <stop offset="1" stop-color="#1b212a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b4a"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8199"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="960" height="660" fill="url(#bg)"/>

  <!-- escritorio -->
  <rect x="0" y="548" width="960" height="112" fill="#c9d3df"/>
  <rect x="0" y="548" width="960" height="3" fill="#b2bfd0"/>

  <!-- soporte del monitor -->
  <path d="M432 508 h96 l16 44 h-128 z" fill="url(#stand)"/>
  <rect x="358" y="548" width="244" height="15" rx="7" fill="url(#stand)"/>

  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="60" y="40" width="840" height="474" rx="18" fill="url(#bezel)"/>
    <rect x="78" y="58" width="804" height="420" rx="8" fill="#0f1622"/>
    <circle cx="480" cy="496" r="4" fill="#6b7684"/>
  </g>

  <!-- contenido de pantalla -->
  <g>
    <!-- barra del navegador con dos pestañas -->
    <rect x="78" y="58" width="804" height="34" rx="8" fill="#0a1017"/>
    <rect x="78" y="80" width="804" height="12" fill="#0a1017"/>
    <circle cx="98" cy="74" r="4.5" fill="#ff5f56"/>
    <circle cx="114" cy="74" r="4.5" fill="#ffbd2e"/>
    <circle cx="130" cy="74" r="4.5" fill="#27c93f"/>
    <rect x="152" y="63" width="230" height="24" rx="6" fill="#182333"/>
    <text x="166" y="79" class="mono" font-size="11" fill="#9db2cc">localhost:8080 · dispositivo</text>
    <rect x="390" y="63" width="234" height="24" rx="6" fill="#131c29"/>
    <text x="404" y="79" class="mono" font-size="11" fill="#63748c">localhost:8123 · Home Assistant</text>

    <!-- ===== panel izquierdo: interfaz web del propio dispositivo ===== -->
    <g>
      <text x="104" y="120" class="ui" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6f8199">INTERFAZ WEB DEL DISPOSITIVO</text>
      <rect x="98" y="132" width="360" height="326" rx="14" fill="#141d2b" stroke="#243247"/>

      <text x="122" y="164" class="ui" font-size="17" font-weight="600" fill="#e9eff7">Termostato simulado</text>
      <circle cx="128" cy="184" r="5" fill="#27c93f"/>
      <text x="142" y="189" class="ui" font-size="12" fill="#8fa3bb">en línea · sala · fw 1.0.3</text>

      <!-- dial -->
      <g transform="translate(206,296)">
        <circle r="62" fill="none" stroke="#22314a" stroke-width="13" stroke-linecap="round"
                stroke-dasharray="292 400" transform="rotate(135)"/>
        <circle r="62" fill="none" stroke="url(#warm)" stroke-width="13" stroke-linecap="round"
                stroke-dasharray="190 400" transform="rotate(135)" filter="url(#glow)"/>
        <text x="0" y="4" text-anchor="middle" class="ui" font-size="38" font-weight="600" fill="#f3f7fc">22.5°</text>
        <text x="0" y="26" text-anchor="middle" class="ui" font-size="12" fill="#8fa3bb">objetivo 23.0°</text>
      </g>

      <!-- lecturas -->
      <g transform="translate(292,236)">
        <rect width="146" height="52" rx="9" fill="#0f1826" stroke="#243247"/>
        <text x="14" y="21" class="ui" font-size="10" letter-spacing="0.8" fill="#6f8199">MODO</text>
        <text x="14" y="40" class="ui" font-size="14" font-weight="600" fill="#ffb184">Calefacción</text>

        <rect y="62" width="146" height="52" rx="9" fill="#0f1826" stroke="#243247"/>
        <text x="14" y="83" class="ui" font-size="10" letter-spacing="0.8" fill="#6f8199">HUMEDAD</text>
        <text x="14" y="102" class="ui" font-size="14" font-weight="600" fill="#e9eff7">46 %</text>
      </g>

      <!-- controles -->
      <g transform="translate(122,380)">
        <rect width="40" height="30" rx="8" fill="#1b2739" stroke="#2c3b52"/>
        <text x="20" y="20" text-anchor="middle" class="ui" font-size="16" fill="#cfe0f2">−</text>
        <rect x="50" width="40" height="30" rx="8" fill="#1b2739" stroke="#2c3b52"/>
        <text x="70" y="20" text-anchor="middle" class="ui" font-size="16" fill="#cfe0f2">+</text>
        <rect x="104" width="86" height="30" rx="8" fill="#ff8a4c22" stroke="#ff8a4c66"/>
        <text x="147" y="20" text-anchor="middle" class="ui" font-size="12" fill="#ffb184">Modo auto</text>
      </g>

      <!-- API -->
      <g transform="translate(122,424)">
        <text y="0" class="mono" font-size="11" fill="#8fd6a6">GET  /api/state        200</text>
        <text y="18" class="mono" font-size="11" fill="#8fd6a6">POST /api/target_temp  200</text>
      </g>
    </g>

    <!-- ===== flecha de integración ===== -->
    <g>
      <line x1="472" y1="296" x2="516" y2="296" stroke="#6f8199" stroke-width="2" marker-end="url(#arrowHead)"/>
      <text x="494" y="278" text-anchor="middle" class="ui" font-size="10" letter-spacing="0.6" fill="#7f93ad">HTTP</text>
      <text x="494" y="316" text-anchor="middle" class="ui" font-size="10" letter-spacing="0.6" fill="#7f93ad">MQTT</text>
    </g>

    <!-- ===== panel derecho: Home Assistant ===== -->
    <g>
      <text x="536" y="120" class="ui" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6f8199">MISMA ENTIDAD EN HOME ASSISTANT</text>
      <rect x="530" y="132" width="330" height="326" rx="14" fill="#111820" stroke="#243247"/>

      <!-- barra superior de HA -->
      <rect x="530" y="132" width="330" height="42" rx="14" fill="#1d2b38"/>
      <rect x="530" y="158" width="330" height="16" fill="#1d2b38"/>
      <g fill="#c8d6e5">
        <rect x="550" y="147" width="16" height="2" rx="1"/>
        <rect x="550" y="152" width="16" height="2" rx="1"/>
        <rect x="550" y="157" width="16" height="2" rx="1"/>
      </g>
      <text x="580" y="159" class="ui" font-size="13" font-weight="600" fill="#e6eef7">Casa</text>
      <circle cx="838" cy="153" r="9" fill="#2b3b4c"/>

      <!-- tarjeta de termostato estilo HA -->
      <g filter="url(#cardShadow)">
        <rect x="556" y="196" width="278" height="242" rx="16" fill="#ffffff"/>
      </g>
      <text x="695" y="224" text-anchor="middle" class="ui" font-size="14" font-weight="500" fill="#3d4145">Termostato sala</text>
      <g fill="#8a9199">
        <circle cx="812" cy="216" r="1.8"/><circle cx="812" cy="222" r="1.8"/><circle cx="812" cy="228" r="1.8"/>
      </g>

      <g transform="translate(695,318)">
        <circle r="60" fill="none" stroke="#e6e8eb" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="283 400" transform="rotate(135)"/>
        <circle r="60" fill="none" stroke="#f7c9a4" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="178 400" transform="rotate(135)"/>
        <circle r="60" fill="none" stroke="#ef7c30" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="24 400" transform="rotate(283)"/>
        <text x="0" y="-16" text-anchor="middle" class="ui" font-size="12" font-weight="600" fill="#ef7c30">Calefacción</text>
        <text x="0" y="18" text-anchor="middle" class="ui" font-size="34" font-weight="500" fill="#2b2e33">23,0</text>
        <text x="30" y="2" class="ui" font-size="12" fill="#2b2e33">°C</text>
        <text x="0" y="40" text-anchor="middle" class="ui" font-size="11" fill="#ef7c30">actual 22,5 °C</text>
      </g>

      <g fill="none" stroke="#c9ced6">
        <circle cx="656" cy="410" r="17"/>
        <circle cx="734" cy="410" r="17"/>
      </g>
      <text x="656" y="416" text-anchor="middle" class="ui" font-size="17" fill="#5b6068">−</text>
      <text x="734" y="416" text-anchor="middle" class="ui" font-size="17" fill="#5b6068">+</text>
    </g>
  </g>

  <!-- teclado -->
  <g filter="url(#shadow)">
    <rect x="340" y="578" width="280" height="42" rx="8" fill="#e7edf4" stroke="#c4cfdb"/>
    <g fill="#cfd8e3">
      <rect x="354" y="588" width="20" height="9" rx="2"/><rect x="380" y="588" width="20" height="9" rx="2"/>
      <rect x="406" y="588" width="20" height="9" rx="2"/><rect x="432" y="588" width="20" height="9" rx="2"/>
      <rect x="458" y="588" width="20" height="9" rx="2"/><rect x="484" y="588" width="20" height="9" rx="2"/>
      <rect x="510" y="588" width="20" height="9" rx="2"/><rect x="536" y="588" width="20" height="9" rx="2"/>
      <rect x="562" y="588" width="20" height="9" rx="2"/><rect x="588" y="588" width="18" height="9" rx="2"/>
      <rect x="392" y="603" width="176" height="9" rx="3"/>
    </g>
  </g>

  <!-- torre de escritorio -->
  <g filter="url(#shadow)">
    <rect x="34" y="368" width="82" height="180" rx="10" fill="#2b333e"/>
    <rect x="48" y="384" width="54" height="8" rx="4" fill="#3f4a58"/>
    <rect x="48" y="400" width="54" height="8" rx="4" fill="#3f4a58"/>
    <circle cx="75" cy="432" r="6" fill="#27c93f"/>
    <rect x="48" y="456" width="54" height="72" rx="6" fill="#232a33"/>
    <g stroke="#3f4a58" stroke-width="2">
      <line x1="56" y1="468" x2="94" y2="468"/><line x1="56" y1="478" x2="94" y2="478"/>
      <line x1="56" y1="488" x2="94" y2="488"/><line x1="56" y1="498" x2="94" y2="498"/>
      <line x1="56" y1="508" x2="94" y2="508"/><line x1="56" y1="518" x2="94" y2="518"/>
    </g>
  </g>
</svg>
